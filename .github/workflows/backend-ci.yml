name: Backend CI

# Every pull request that touches the backend must prove itself: lint, type check, migrations
# on a real PostgreSQL, and every test.
on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, staging]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awards
          POSTGRES_PASSWORD: awards
          POSTGRES_DB: awards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awards -d awards_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://awards:awards@localhost:5432/awards_test
      DIRECT_URL: postgresql://awards:awards@localhost:5432/awards_test
      TEST_DATABASE_URL: postgresql://awards:awards@localhost:5432/awards_test
      SHADOW_DATABASE_URL: postgresql://awards:awards@localhost:5432/awards_shadow
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: "Awards CI <ci@awards.local>"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Backend/.nvmrc
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Create the shadow database for the drift check
        run: PGPASSWORD=awards psql -h localhost -U awards -d awards_test -c "CREATE DATABASE awards_shadow"
      - run: npm run lint
      - run: npm run typecheck
      - name: Check the schema and the migrations agree
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      # The type check can't see a wrong field nested in a Prisma query (its methods are generic),
      # so the seed is run for real: on a fresh database, twice, because it must be safe to repeat.
      - name: Seed a fresh database twice
        env:
          DATABASE_URL: postgresql://awards:awards@localhost:5432/awards_seed
          DIRECT_URL: postgresql://awards:awards@localhost:5432/awards_seed
          LEADER_EMAIL: leader@ci.test
          LEADER_PASSWORD: ci-only-leader-password
          DEMO_PASSWORD: ci-only-demo-password
        run: |
          PGPASSWORD=awards psql -h localhost -U awards -d awards_test -c "CREATE DATABASE awards_seed"
          npx prisma migrate deploy
          npm run db:seed
          npm run db:seed
      - run: npm test
      - run: npm run build
